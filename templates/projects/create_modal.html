
<div class="project-create">
    <div class="project-create-header">
        <h2>プロジェクト新規登録</h2>
        <p>新しいプロジェクトの情報を入力してください</p>
    </div>

    <form id="project-create-form">
        <div class="form-group">
            <label for="project-name">プロジェクト名 <span class="required">*</span></label>
            <input type="text" id="project-name" name="name"
                   placeholder="例：Wibby開発プロジェクト" required>
        </div>

        <div class="form-group">
            <label for="summary">概要</label>
            <textarea id="summary" name="summary"
                      placeholder="プロジェクトの概要を入力"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="start-date">開始日</label>
                <input type="date" id="start-date" name="start_date">
            </div>

            <div class="form-group">
                <label for="end-date">終了日</label>
                <input type="date" id="end-date" name="end_date">
            </div>
        </div>

        <div class="form-group">
            <label for="status">ステータス</label>
            <select id="status" name="status">
                <option value="not_started">未着手</option>
                <option value="progress">進行中</option>
                <option value="completed">完了</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="button" id="cancel" class="btn-cancel">
                キャンセル
            </button>
            <button type="submit" id="regist" class="btn-submit">
                登録する
            </button>
        </div>
    </form>
</div>
